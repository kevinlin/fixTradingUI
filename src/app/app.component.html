<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #drawer
    class="sidenav"
    fixedInViewport="true"
    [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
    [mode]="(isHandset$ | async) ? 'over' : 'side'"
    [opened]="!(isHandset$ | async)">
    <mat-toolbar color="primary">菜单</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item *ngFor="let link of navLinks" [routerLink]="link.path" routerLinkActive="active">
        {{link.label}}
      </a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button type="button" aria-label="Toggle sidenav" mat-icon-button (click)="drawer.toggle()" *ngIf="isHandset$ | async">
        <mat-icon aria-label="Side nav toggle icon">菜单</mat-icon>
      </button>
      <h3>商品期货价差策略交易 - {{title}}</h3>
      <span class="fill-remaining-space"></span>
      <span *ngIf="currentUser">
        <mat-icon class="example-icon">person</mat-icon>
        {{currentUser.username}}
      </span>
    </mat-toolbar>
    <div id="main-content">
      <br/>
      <router-outlet></router-outlet>
      <br/>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
