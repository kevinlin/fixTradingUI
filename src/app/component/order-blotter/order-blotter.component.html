<br/>
<mat-card class="mat-elevation-z8">
  <mat-card-header>

    <mat-form-field>
      <input matInput [(ngModel)]="queryDate" type="date" placeholder="日期" [required]="true">
    </mat-form-field>&nbsp;
    <button mat-raised-button color="primary" (click)="queryOrders()">查询</button>

  </mat-card-header>
  <mat-card-content>

    <mat-table class="full-width-table" [dataSource]="dataSource" matSort aria-label="Elements">
      <ng-container matColumnDef="date">
        <mat-header-cell *matHeaderCellDef mat-sort-header>Date</mat-header-cell>
        <mat-cell *matCellDef="let row">{{row.date}}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="strategy">
        <mat-header-cell *matHeaderCellDef mat-sort-header>Strategy</mat-header-cell>
        <mat-cell *matCellDef="let row">{{row.tradingOperation?.tradingStrategy?.name}}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="symbol">
        <mat-header-cell *matHeaderCellDef mat-sort-header>Symbol</mat-header-cell>
        <mat-cell *matCellDef="let row">{{row.symbol}}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="clOrdID">
        <mat-header-cell *matHeaderCellDef mat-sort-header>ClOrdID</mat-header-cell>
        <mat-cell *matCellDef="let row">{{row.clOrdID}}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="orderID">
        <mat-header-cell *matHeaderCellDef mat-sort-header>OrderID</mat-header-cell>
        <mat-cell *matCellDef="let row">{{row.orderID}}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="side">
        <mat-header-cell *matHeaderCellDef mat-sort-header>Side</mat-header-cell>
        <mat-cell *matCellDef="let row">{{row.side}}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="price">
        <mat-header-cell *matHeaderCellDef mat-sort-header>Price</mat-header-cell>
        <mat-cell *matCellDef="let row">{{row.price}}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="size">
        <mat-header-cell *matHeaderCellDef mat-sort-header>Size</mat-header-cell>
        <mat-cell *matCellDef="let row">{{row.size}}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="status">
        <mat-header-cell *matHeaderCellDef mat-sort-header>Status</mat-header-cell>
        <mat-cell *matCellDef="let row">{{row.ordStatus}}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="transactTime">
        <mat-header-cell *matHeaderCellDef mat-sort-header>TransactTime</mat-header-cell>
        <mat-cell *matCellDef="let row">{{row.transactTime | date:'HH:mm:ss.SSS'}}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="text">
        <mat-header-cell *matHeaderCellDef mat-sort-header>Text</mat-header-cell>
        <mat-cell *matCellDef="let row" class="text-nowrap">{{row.text}}</mat-cell>
      </ng-container>

      <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
    <mat-paginator #paginator [length]="dataSource.data.length" [pageIndex]="0" [pageSize]="50" [pageSizeOptions]="[25, 50, 100, 250]"></mat-paginator>

  </mat-card-content>
</mat-card>
<br/>
