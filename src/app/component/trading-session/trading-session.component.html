<div *ngIf="!loading; else elseBlock">
  <div class="row">
    <div class="col-xs-4 form-container">
      <h3>Instrument Pair</h3>
      <mat-form-field>
        <mat-select [(ngModel)]="tradingSession.sgxInstrument.symbol" placeholder="新交所期货合约" required="true">
          <mat-option *ngFor="let instrument of sgxInstruments | async" [value]="instrument.symbol">
            {{instrument.symbol}} ({{instrument.maturity.monthLabel}}{{instrument.maturity.year}})
          </mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field>
        <mat-select [(ngModel)]="tradingSession.dceInstrument.symbol" placeholder="大商所期货合约" required="true">
          <mat-option *ngFor="let instrument of dceInstruments | async" [value]="instrument.symbol">
            {{instrument.symbol}} ({{instrument.maturity.monthLabel}}{{instrument.maturity.year}})
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
    <div class="col-xs-4 form-container">
      <h3>Session Details</h3>
      <mat-form-field>
        <input matInput [(ngModel)]="tradingSession.date" placeholder="交易日" type="date" required>
      </mat-form-field>
      <mat-form-field>
        <input matInput [(ngModel)]="tradingSession.benchmarkExchangeRate" type="number" placeholder="远期基准汇率" required class="right-align">
        <span matSuffix>&nbsp;USD/CNY</span>
      </mat-form-field>
    </div>
    <div class="col-xs-4">
      <h3>Session State</h3>
      <h1><span class="label label-default" [ngClass]="{
          'label-success': tradingSession.sessionState === 'START',
          'label-danger': tradingSession.sessionState ==='STOP'
        }">
      {{tradingSession.sessionState}}
    </span></h1>
    </div>
  </div>
  <div class="action-row">
    <button mat-raised-button color="primary" (click)="startSession()" [disabled]="tradingSession.sessionState === 'START'">Start Session</button>&nbsp;
    <button mat-raised-button color="accent" disabled [disabled]="tradingSession.sessionState === 'SUSPEND'">Suspend Session</button>&nbsp;
    <button mat-raised-button color="warn" (click)="stopSession()" [disabled]="tradingSession.sessionState === 'STOP'">Stop Session</button>
  </div>
</div>
<ng-template #elseBlock>
  <mat-spinner></mat-spinner>
</ng-template>
