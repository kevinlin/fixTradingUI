<mat-card class="mat-elevation-z8">
  <mat-card-header>
    <h3>通知中心</h3>
  </mat-card-header>
  <mat-card-content>
    <table class="table table-hover ">
      <thead>
      <tr>
        <th>时间戳</th>
        <th>类别</th>
        <th>操作</th>
        <th>详细信息</th>
        <th>数据</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let toast of toastr.notificationsSubject | async" class="{{getToastStyle(toast.type)}}">
        <td>{{toast.timestamp  | date:'yyyyMMdd HH:mm:ss.SSS'}}</td>
        <td>{{toast.type}}</td>
        <td>{{toast.title}}</td>
        <td>{{toast.message}}</td>
        <td>{{toast.data | json}}</td>
      </tr>
      </tbody>
    </table>
  </mat-card-content>
  <mat-card-actions>
    <button mat-raised-button color="warn" (click)="toastr.clearSavedNotifications()">清空</button>
  </mat-card-actions>
</mat-card>
