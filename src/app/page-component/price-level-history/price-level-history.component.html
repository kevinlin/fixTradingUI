<mat-card class="mat-elevation-z8">
  <mat-card-header>
    <div class="row">
      <div class="col">
        <mat-form-field>
          <mat-select [(ngModel)]="selectedStrategy" [required]="true" placeholder="交易策略">
            <mat-option *ngFor="let strategy of allStrategies | async" [value]="strategy">{{strategy.name}}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col">
        <mat-form-field>
          <mat-select [(ngModel)]="selectedInterval" [required]="true" placeholder="时间间隔">
            <mat-option *ngFor="let choice of priceLevelIntervals" [value]="choice">{{choice}}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col">
        <mat-form-field>
          <input matInput [(ngModel)]="startDate" type="date" placeholder="开始日期" [required]="true">
        </mat-form-field>&nbsp;
      </div>
      <div class="col">
        <mat-form-field>
          <input matInput [(ngModel)]="endDate" type="date" placeholder="结束日期" [required]="true">
        </mat-form-field>&nbsp;
      </div>
      <div class="col">
        <button mat-raised-button color="primary" (click)="queryPriceLevels()">查询</button>
      </div>
    </div>
  </mat-card-header>
  <mat-card-content>
    <mat-spinner *ngIf="isLoading"></mat-spinner>
    <div class="row">
      <div class="col">
        <hot-table
          [hotId]="hotId"
          [data]="historyPriceLevels"
          [columns]="columns"
          [height]="options.height"
          [rowHeaders]="options.rowHeaders"
          [startRows]="options.startRows"
          [stretchH]="options.stretchH"
          [columnSorting]="options.columnSorting"
          [contextMenu]="options.contextMenu"
          [className]="options.className"
          [readOnly]="options.readOnly"
          [licenseKey]="'non-commercial-and-evaluation'"
        ></hot-table>
      </div>
      <div class="col">
        <button mat-raised-button color="primary" (click)="exportCSV()">Export as CSV</button>
      </div>
    </div>
  </mat-card-content>
</mat-card>
