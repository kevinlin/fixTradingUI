<app-market-watcher></app-market-watcher>
<br/>
<mat-card class="mat-elevation-z8">
  <mat-card-header>
    <h3>申报单明细</h3>
  </mat-card-header>
  <mat-card-content>
    <mat-table #orderTable [dataSource]="orderBlotterDataSource" matSort aria-label="Elements">
      <ng-container matColumnDef="date">
        <mat-header-cell *matHeaderCellDef mat-sort-header>日期</mat-header-cell>
        <mat-cell *matCellDef="let row">{{row.date}}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="strategy">
        <mat-header-cell *matHeaderCellDef mat-sort-header>策略</mat-header-cell>
        <mat-cell *matCellDef="let row">{{row.tradingOperation?.tradingStrategy?.name}}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="symbol">
        <mat-header-cell *matHeaderCellDef mat-sort-header>合约</mat-header-cell>
        <mat-cell *matCellDef="let row">{{row.symbol}}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="clOrdID">
        <mat-header-cell *matHeaderCellDef mat-sort-header>客户合约编号</mat-header-cell>
        <mat-cell *matCellDef="let row">{{row.clOrdID}}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="orderID">
        <mat-header-cell *matHeaderCellDef mat-sort-header>合约编号</mat-header-cell>
        <mat-cell *matCellDef="let row">{{row.orderID}}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="side">
        <mat-header-cell *matHeaderCellDef mat-sort-header>方向</mat-header-cell>
        <mat-cell *matCellDef="let row">{{row.side}}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="price">
        <mat-header-cell *matHeaderCellDef mat-sort-header>价格</mat-header-cell>
        <mat-cell *matCellDef="let row">{{row.price}}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="size">
        <mat-header-cell *matHeaderCellDef mat-sort-header>手数</mat-header-cell>
        <mat-cell *matCellDef="let row">{{row.size}}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="status">
        <mat-header-cell *matHeaderCellDef mat-sort-header>状态</mat-header-cell>
        <mat-cell *matCellDef="let row">{{row.ordStatus}}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="text">
        <mat-header-cell *matHeaderCellDef mat-sort-header>详细信息</mat-header-cell>
        <mat-cell *matCellDef="let row">{{row.text}}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="transactTime">
        <mat-header-cell *matHeaderCellDef mat-sort-header>交易时间</mat-header-cell>
        <mat-cell *matCellDef="let row">{{row.transactTime | date:'HH:mm:ss.SSS'}}</mat-cell>
      </ng-container>

      <mat-header-row *matHeaderRowDef="orderBlotterDisplayedColumns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: orderBlotterDisplayedColumns;"></mat-row>
    </mat-table>

    <mat-paginator #orderBlotterPaginator [length]="orderBlotterDataSource.data.length" [pageIndex]="0" [pageSize]="25" [pageSizeOptions]="[25, 50, 100]"></mat-paginator>
  </mat-card-content>
</mat-card>
